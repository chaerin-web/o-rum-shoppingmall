<!DOCTYPE html>
<html lang="ko">

<head>

    <meta name="author" content="O'RUM 쇼핑몰">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="O'RUM 쇼핑몰">
    <meta property="og:title" content="O'RUM 쇼핑몰 | 신상품">
    <meta property="og:description" content="새로운 계절, 새로운 공간을 위한 O'RUM 신상품">
    <meta property="og:image" content="./img/banner-new-pc.jpg">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png">

    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/footer.css">

    <link rel="stylesheet" href="./css/list.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

    <script src="./js/new-product.js"></script>
    <script src="./js/won.js"></script>
    <script src="./js/product-control-new.js" defer></script>

<body>
    <div id="header-wrap">
        <!-- header.html 파일의 내용이 들어오는 영역 -->

    <main>
        <div class="hero-banner">
            <a href="#">
                <picture>
                    <source media="(max-width:768px)" srcset="./img/banner-new-mo.jpg">
                    <source media="(max-width:1024px)" srcset="./img/banner-new-pad.jpg">
                    <img src="./img/banner-new-pc.jpg" alt="오름 쇼핑몰 신상품 배너 이미지">
                </picture>
            </a>
        </div>

        <section class="con1">
            <div class="common-frame">
                <div class="title">
                    <h1>JUST ARRIVED</h1>
                    <span></span>
                    <p>새로운 계절, 새로운 공간을 위한 O’RUM의 신상품</p>
                </div>
                <ul class="new-product grid-list">
                    <li>
                        <a href="#">
                            <figure><img src="./img/con3-1.jpg" alt="특가상품1"></figure>
                            <div class="sale-txt">

                                <div class="pay-frame">
                                    <div class="discount">25%</div>
                                    <div class="pay"><b>1,635,000</b>원</div>
                                </div>
                            </div>
                        </a>
                    </li>
                </ul>
            </div>
        </section>
    </main>

    <div id="footer-wrap">
        <!-- footer.html 파일의 내용이 들어오는 영역 -->
    </div>
</body>

</html>
